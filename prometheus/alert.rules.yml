groups:
  - name: host-and-containers
    rules:
      - alert: ContainerRestarted
        expr: resets(container_cpu_usage_seconds_total{name!=""}[5m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Контейнер {{ $labels.name }} перезапускался"

      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Цель {{ $labels.job }} ({{ $labels.instance }}) недоступна"

      - alert: DiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Диск {{ $labels.mountpoint }} заполнен на {{ $value | printf \"%.0f\" }}%"

      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Занято {{ $value | printf \"%.0f\" }}% оперативной памяти"

      - alert: HighCpuUsage
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Загрузка CPU {{ $value | printf \"%.0f\" }}% уже 10 минут"

      - alert: ContainerDown
        expr: time() - container_last_seen{name!=""} > 60
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Контейнер {{ $labels.name }} не виден больше минуты"
